name: keep-supabase-awake

# Supabase 무료 프로젝트가 활동 없음으로 일시 정지되지 않도록 이틀에 한 번 조회합니다.
# 실패하면 (정지됐거나 설정이 깨진 경우) 이 작업이 실패로 표시됩니다.
on:
  schedule:
    - cron: '17 3 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query shared floor plans table
        run: |
          curl -fsS -m 30 "https://pvjrbhsgffadiklpiknk.supabase.co/rest/v1/floorplans?select=id&limit=1" -H "apikey: sb_publishable_d4NBdGqpxrg__1SXiRA-YA_TDutoT7B"
      - name: Query ranking project root
        run: |
          curl -fsS -m 30 -o /dev/null "https://pvjrbhsgffadiklpiknk.supabase.co/rest/v1/" -H "apikey: sb_publishable_d4NBdGqpxrg__1SXiRA-YA_TDutoT7B"
